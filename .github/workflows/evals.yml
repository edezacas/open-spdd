# Static validation of the framework's eval assets.
#
# The agent-run eval suites themselves stay manual (expensive, need API keys) —
# this workflow only does cheap structural checks: every spdd-*/evals/evals.json
# must parse as JSON with unique ids and non-empty prompt/assertions, the three
# hook-setup.md asset copies must stay in sync, and the never-block rule must
# stay byte-identical between spdd-agent/SKILL.md and the 8 wrapper templates.
#
# Repo tooling: no SKILL.md references this file at execution time.

name: eval-asset-checks

on:
  push:
    paths:
      - '**/evals/evals.json'
      - '**/assets/hook-setup.md'
      - '**/assets/agent-claude-code.md'
      - '**/assets/agent-opencode.md'
      - 'spdd-agent/SKILL.md'
  pull_request:
    paths:
      - '**/evals/evals.json'
      - '**/assets/hook-setup.md'
      - '**/assets/agent-claude-code.md'
      - '**/assets/agent-opencode.md'
      - 'spdd-agent/SKILL.md'

jobs:
  validate:
    name: Validate eval assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate every evals.json (JSON validity, unique ids, required fields)
        run: |
          python3 - <<'EOF'
          import json
          import sys
          from pathlib import Path

          files = sorted(Path(".").glob("spdd-*/evals/evals.json"))
          if not files:
              print("no spdd-*/evals/evals.json files found")
              sys.exit(1)

          failed = False
          for path in files:
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except (json.JSONDecodeError, UnicodeDecodeError, OSError) as exc:
                  print(f"{path}: not valid JSON: {exc}")
                  failed = True
                  continue

              evals = data.get("evals") if isinstance(data, dict) else data
              if not isinstance(evals, list) or not evals:
                  print(f'{path}: "evals" must be a non-empty list')
                  failed = True
                  continue

              ids = [ev.get("id") for ev in evals]
              duplicates = sorted({i for i in ids if ids.count(i) > 1})
              if duplicates:
                  print(f"{path}: duplicate eval ids: {duplicates}")
                  failed = True

              for ev in evals:
                  eval_id = ev.get("id")
                  if not str(ev.get("prompt") or "").strip():
                      print(f"{path}: eval id {eval_id}: empty or missing prompt")
                      failed = True
                  assertions = ev.get("assertions")
                  if (
                      not isinstance(assertions, list)
                      or not assertions
                      or not all(str(a).strip() for a in assertions)
                  ):
                      print(f"{path}: eval id {eval_id}: empty or missing assertions")
                      failed = True

          sys.exit(1 if failed else 0)
          EOF

      - name: Guard-hook asset copies stay in sync
        run: bash scripts/check-hook-sync.sh

      - name: Never-block rule stays in sync across wrapper templates
        run: bash scripts/check-agent-sync.sh
